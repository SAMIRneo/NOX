<style>
/* ===== BLEU NUIT & OR — DA de NOX ===== */
:root,[data-theme="dark"]{
  --paper:#0B1222;--bg:#0B1222;--bg2:#111B30;--card:#131F38;--card2:#182642;--card3:#223252;
  --ink:#F2EAD8;--fg:#F2EAD8;--mut:#A9AFC2;--dim:#7C859E;--line:#253654;--line2:#3A4C6E;
  --ac:#D4A94E;--ac-text:#E8C87A;--ac-tx:#0B1222;--ac-soft:rgba(212,169,78,.12);
  --ok:#6FCF97;--wa:#E0B84C;--bad:#EF6B63;--info:#7FA8E0;
  --em:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji";
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sh:0 6px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --paper:#F5F2EA;--bg:#F5F2EA;--bg2:#EAE6DA;--card:#FFFFFF;--card2:#F9F7F1;--card3:#EDE9DE;
  --ink:#16213B;--fg:#16213B;--mut:#5C6480;--dim:#7C859E;--line:#D6D9E2;--line2:#B9BFD0;
  --ac:#9A7622;--ac-text:#7A5B14;--ac-tx:#FFFFFF;--ac-soft:rgba(154,118,34,.10);
  --ok:#1E6E4B;--wa:#9A6700;--bad:#B3261E;--info:#2A4E8C;
  --sh:0 6px 20px rgba(20,33,59,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--sans);padding-bottom:calc(74px + env(safe-area-inset-bottom));overflow-x:hidden;border-top:4px solid var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.mono{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.03em}
/* Header */
header.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 0 10px}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbtns{display:flex;gap:8px}
.logo{font:700 20px/1 var(--serif);letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.logo span{color:var(--ac);font-style:italic}
.icobtn{width:44px;height:44px;border-radius:6px;background:transparent;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;position:relative}
.icobtn:active{transform:scale(.94)}
h1.page{font:700 30px/1.1 var(--serif);letter-spacing:-.02em;margin:10px 0 2px}
.sub{color:var(--mut);font-size:13px}
/* Bottom nav — 5 onglets */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.navin{max-width:720px;margin:auto;display:flex;justify-content:space-around;align-items:stretch}
.nb{flex:1;min-width:0;height:58px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);font-size:10px;font-weight:700}
.nb i{font-style:normal;font-size:20px;line-height:1;font-family:var(--em)}
.nb.on{color:var(--ac);background:var(--ac-soft)}
.nb.add i{background:var(--ink);color:var(--paper);width:44px;height:44px;border-radius:4px;display:grid;place-items:center;font-size:26px;font-weight:400;margin-top:-14px;font-family:inherit}
/* Sections papier : traits fins, pas d'ombres, serif pour les titres */
.section{border-top:1px solid var(--line);margin:22px 0 0;padding-top:12px}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;margin:0}
.card.tight{padding:12px 0}
.card.accent{border-left:3px solid var(--ac);padding-left:14px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sec-title{font:700 12px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sec-title .em{font-family:var(--em);font-size:15px;letter-spacing:0;line-height:1;margin-right:4px}
.big{font:800 44px/1 var(--serif);letter-spacing:-.03em}
.muted{color:var(--mut)}.dim{color:var(--dim)}.tiny{font-size:12px}.small{font-size:13px}
.ac{color:var(--ac)}.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:8px 14px;background:transparent;border:1px solid var(--line);font-size:12px;font-weight:700;min-height:44px}
.chk{width:44px;height:44px;flex:none;border:2px solid var(--line2);border-radius:3px;background:transparent;font-size:20px;font-weight:900;display:grid;place-items:center}
.chk.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:3px;background:transparent;border:1px solid var(--ink);font-weight:700;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.seg{display:flex;background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;min-height:44px;padding:0 12px;border-radius:2px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg.ac button.on{background:var(--ac);color:var(--ac-tx)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:16px 0 6px}
input.f,select.f,textarea.f{width:100%;min-height:48px;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:10px 2px;outline:none;font-size:16px}
input.f:focus,select.f:focus,textarea.f:focus{border-bottom-color:var(--ac)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:transparent;border:0;border-right:1px solid var(--line);padding:8px;text-align:center}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 25px/1.1 var(--serif);letter-spacing:-.03em}
.stat span{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty i{font-style:normal;font-size:40px;display:block;margin-bottom:8px;font-family:var(--em)}
.bar{height:6px;background:var(--line);border-radius:0;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:0;transition:width .4s ease}
.hint{background:var(--ac-soft);border-left:3px solid var(--ac);padding:10px 12px;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:200;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:3px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
/* Sheet (conservé pour les sous-écrans) */
#sheet{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(17,17,17,.45)}
#sheet.open{display:flex}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow-y:auto;background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:3px;background:var(--line2);margin:6px auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-head h2{font:700 26px/1.1 var(--serif);letter-spacing:-.02em}
/* Transaction list */
.tx-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;margin:0}
.tx-row.depense{border-left:3px solid var(--bad);padding-left:10px}
.tx-row.rentree{border-left:3px solid var(--ok);padding-left:10px}
.tx .nm{flex:1;min-width:0;font-weight:700}
.tx .cat{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tx .montant{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.tx .montant.depense{color:var(--bad)}
.tx .montant.rentree{color:var(--ok)}
.tx .date{font-size:11px;color:var(--dim)}
.tx .rec{color:var(--wa);font-size:10px;font-weight:800;margin-left:6px;font-family:var(--em)}
.cat-chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;flex-wrap:wrap}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat-chips button small{opacity:.7;margin-left:4px}
/* Recurring */
.rec-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.rec-item .nm{flex:1;font-weight:700}
.rec-item .montant{font-variant-numeric:tabular-nums;font-weight:800}
.rec-item .montant.depense{color:var(--bad)}
.rec-item .montant.rentree{color:var(--ok)}
.rec-item .jour{font-size:11px;color:var(--dim)}
/* Insight cards */
.insight{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.insight .ic{width:40px;height:40px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none;font-family:var(--em)}
.insight .val{font:800 24px/1 var(--serif)}
.insight .lab{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* Onboarding — page papier */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;max-width:560px;margin:auto}
.onb .step{font-size:12px;font-weight:800;color:var(--ac);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.onb h1{font:700 42px/1.08 var(--serif);letter-spacing:-.02em;margin-bottom:12px}
.onb .lead{color:var(--mut);font-size:17px;line-height:1.55;margin-bottom:28px}
.onb .big-emoji{font-size:60px;text-align:center;margin-bottom:24px;font-family:var(--em)}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:28px 0}
.onb .dots i{width:8px;height:8px;background:var(--line2);transition:.2s}
.onb .dots i.on{background:var(--ink);width:24px}
.onb .card-opt{background:transparent;border:1px solid var(--line);border-radius:0;padding:16px;margin:8px 0;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:64px}
.onb .card-opt.on{border:2px solid var(--ink);background:var(--ac-soft)}
.onb .card-opt .e{font-size:28px;font-family:var(--em)}
/* ===== SECTION ANALYSE (camembert + import) ===== */
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin:18px 0}
.donut{width:200px;height:200px;flex:none}
.donut circle{fill:none;stroke-width:26;transform:rotate(-90deg);transform-origin:100px 100px}
.donut .bg{stroke:var(--line)}
.donut-center{font:800 22px/1 var(--serif);fill:var(--ink)}
.donut-sub{font:600 10px/1 var(--sans);fill:var(--mut)}
.legend{flex:1;min-width:200px}
.legend-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.legend-row:last-child{border-bottom:0}
.legend .dot{width:12px;height:12px;flex:none;border-radius:50%}
.legend .nm{flex:1;min-width:0;font-weight:700;font-size:13px}
.legend .vals{text-align:right;flex:none}
.legend .pc{display:block;font:800 20px/1 var(--serif);font-variant-numeric:tabular-nums}
.legend .am{display:block;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:2px}
.marchands-liste{max-height:420px;overflow-y:auto;scrollbar-width:thin}
.marchands-liste .legend-row{gap:8px}
.marchands-liste .rang{width:22px;flex:none;font-size:11px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.marchands-liste .nm{font-size:13px}
.marchands-liste .pc{display:inline;font:700 11px/1 var(--sans);color:var(--mut);flex:none}
.marchands-liste .am{display:inline;font-weight:800;color:var(--ink);font-size:12px;min-width:72px;text-align:right;margin-top:0}
.drop{border:2px dashed var(--line2);padding:22px;text-align:center;cursor:pointer;margin:12px 0;transition:.2s}
.drop:hover,.drop.over{border-color:var(--ac);background:var(--ac-soft)}
.drop .ic{font-size:32px;font-family:var(--em)}
.period{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.period button{min-height:44px;padding:0 12px;border:1px solid var(--line);font-size:12px;font-weight:700}
.period button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar-cat{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar-cat .lb{width:110px;font-size:12px;font-weight:700;flex:none}
.bar-cat .tr{flex:1;height:10px;background:var(--line)}
.bar-cat .fl{height:100%}
.bar-cat .vl{width:70px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
/* Formulaire pleine page (bouton +) */
.page-head{display:flex;align-items:center;gap:12px;margin:12px 0 20px}
.page-head .back{width:44px;height:44px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.page-head h2{font:700 32px/1.1 var(--serif);letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){.sheet,.btn,.icobtn,.nb.add i,.bar>i{animation:none!important;transition:none!important}}
</style>

<script>
/* Gestion centralisée des dialogues : ouverture, focus, touche Échap, piège Tab */
let sheetReturn=null;
function openSheet(){
  const s=$('#sheet');sheetReturn=document.activeElement;
  s.classList.add('open');s.setAttribute('aria-hidden','false');
  setTimeout(()=>{const b=$('#btn-close')||s.querySelector('button');b?.focus()},60);
}
function closeSheet(){
  const s=$('#sheet');s.classList.remove('open');s.setAttribute('aria-hidden','true');
  if(sheetReturn&&sheetReturn.isConnected)sheetReturn.focus();
  sheetReturn=null;
}
document.addEventListener('keydown',e=>{
  const s=$('#sheet');
  if(!s.classList.contains('open'))return;
  if(e.key==='Escape'){closeSheet();return;}
  if(e.key==='Tab'){
    const f=[...s.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
</script>

<script>
'use strict';
/* =========================================================
   ARGENT GESTION — v2
   Dépenses, rentrées, épargne, opérations récurrentes
   Onboarding + nav 5 onglets + insights quotidiens
   ========================================================= */
const $= (s,r=document)=>r.querySelector(s);
const $$= (s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>{
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  let s=String(v??'').replace(/[\s\u00a0\u202f]/g,'');
  if(/,\d{1,2}$/.test(s)&&s.includes('.'))s=s.replace(/\./g,''); /* 1.234,56 */
  else s=s.replace(',','.');                                    /* 1234,56 */
  const x=parseFloat(s);return Number.isFinite(x)?x:0;
};
const fmtNum=v=>{const n=num(v);return Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',')};
const fmtJour=v=>{const n=Math.round(num(v)*10)/10;return String(n).replace('.',',')};
/* Format brut pour les champs <input type=number> : point décimal, pas de virgule */
const fmtInput=v=>{const n=num(v);return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)};
function ymd(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function dayAdd(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}

/* ============ CATÉGORIES ============ */
const CAT_DEPENSE=['Logement','Nourriture','Transport','Loisirs','Santé','Vêtements','Éducation','Abonnements','Autre'];
const CAT_RENTEE=['Salaire','Bourse','Cadeau','Vente','Autre'];
const ALL_CATS=[...CAT_DEPENSE,...CAT_RENTEE];

/* ============ ÉTAT ============ */
let D=null,VIEW='accueil',HIST_MOIS=null,HIST_Q='',CAT_FILTRE=null;
function blank(){
  return {
    v:3,created:ymd(),onboarded:false,
    profile:{prenom:'',devise:'€',revenusMensuels:0,objectifEpargne:0},
    transactions:[],recurrents:[],epargneDepots:[],importReleve:[],analyseDemo:false,
    settings:{theme:'dark',ac:'#D4A94E'}
  };
}
function safeParse(s,f){try{return s?JSON.parse(s):f}catch{return f}}
function safeRaw(k){try{return localStorage.getItem(k)}catch{return null}}
function safeGet(k,f){return safeParse(safeRaw(k),f)}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Stockage plein — données non sauvegardées');return false}}
function sanitizeData(o){
  const d=blank();
  if(!o||typeof o!=='object'||Array.isArray(o))return d;
  const p=o.profile||{};
  d.v=3;
  d.created=/^\d{4}-\d{2}-\d{2}$/.test(o.created)?o.created:ymd();
  d.onboarded=Boolean(o.onboarded);
  d.profile={
    prenom:String(p.prenom??'').slice(0,40).replace(/[<>"`]/g,''),
    devise:String(p.devise??'€').slice(0,5),
    revenusMensuels:num(p.revenusMensuels??p.budgetMensuel)||0,
    objectifEpargne:num(p.objectifEpargne)||0
  };
  d.transactions=Array.isArray(o.transactions)?o.transactions.filter(x=>x&&typeof x==='object').map(x=>({
    id:String(x.id??uid()).slice(0,40),type:x.type==='rentree'?'rentree':'depense',
    categorie:String(x.categorie??'Autre').slice(0,40),montant:num(x.montant)||0,
    date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:ymd(),
    note:String(x.note??'').slice(0,200).replace(/[<>"`]/g,''),
    recursif:Boolean(x.recursif),recurrenceld:String(x.recurrenceld??'').slice(0,40)
  })).slice(0,5000):[];
  d.recurrents=Array.isArray(o.recurrents)?o.recurrents.filter(x=>x&&typeof x==='object').map(x=>({
    id:String(x.id??uid()).slice(0,40),nom:String(x.nom??'').slice(0,60),
    type:x.type==='rentree'?'rentree':'depense',categorie:String(x.categorie??'Autre').slice(0,40),
    montant:num(x.montant)||0,jour:clamp(num(x.jour)||1,1,28),actif:Boolean(x.actif)
  })).slice(0,500):[];
  /* Épargne — dépôts enregistrés (v3) */
  d.epargneDepots=Array.isArray(o.epargneDepots)?o.epargneDepots.filter(x=>x&&typeof x==='object'&&num(x.montant)>0).map(x=>({
    id:String(x.id??uid()).slice(0,40),
    montant:num(x.montant),
    date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:ymd(),
    note:String(x.note??'').slice(0,200).replace(/[<>"`]/g,'')
  })).slice(0,5000):[];
  /* Import Revolut : conservé à travers les rechargements */
  d.analyseDemo=Boolean(o.analyseDemo);
  d.importReleve=Array.isArray(o.importReleve)?o.importReleve.filter(x=>x&&typeof x==='object').map(x=>({
    date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:ymd(),
    desc:String(x.desc??'').slice(0,200).replace(/[<>"`]/g,''),
    montant:num(x.montant),
    cat:String(x.cat??'').slice(0,40)
  })).slice(0,10000):[];
  const s=o.settings||{};const hex=v=>/^#[0-9a-f]{6}$/i.test(v)?v:'#D4A94E';
  d.settings={theme:s.theme==='dark'?'dark':'light',ac:hex(s.ac),acCustom:Boolean(s.acCustom)};
  return d;
}
function loadAccount(){
  D=sanitizeData(safeGet('mcos-argent-gestion:data',null));
  save();genereRecurrentsMois();
}

/* ============ OPÉRATIONS RÉCURRENTES ============ */
function genereRecurrentsMois(){
  const m=ymd().slice(0,7);
  /* Une seule génération par règle, même si on ajoute une règle en cours de mois */
  const deja=new Set(D.transactions.filter(t=>t.recursif&&t.date.slice(0,7)===m).map(t=>t.recurrenceld));
  const ajoutes=[];
  for(const r of D.recurrents){
    if(!r.actif||deja.has(r.id))continue;
    const annee=parseInt(m.slice(0,4)),mois=parseInt(m.slice(5,7))-1;
    const dernier=new Date(annee,mois+1,0).getDate();
    const j=Math.min(r.jour,dernier);
    const date=String(annee)+'-'+String(mois+1).padStart(2,'0')+'-'+String(j).padStart(2,'0');
    D.transactions.push({id:uid(),type:r.type,categorie:r.categorie,montant:r.montant,date,note:'Récurrent : '+r.nom,recursif:true,recurrenceld:r.id});
    ajoutes.push(r.nom);
  }
  if(ajoutes.length){save();toast(ajoutes.length+' opération(s) automatique(s) ajoutée(s)');}
}

/* ============ CALCULS ============ */
function moisCourant(){return ymd().slice(0,7);}
function moisPrecedent(){
  const d=new Date(ymd()+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()-1);
  return ymd(d).slice(0,7);
}
function nomMois(m){return new Date(m+'-01T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function filtresMois(m){return D.transactions.filter(t=>t.date.slice(0,7)===m)}
function totaux(m=moisCourant()){
  /* N'inclut pas les opérations à venir : on ne compte que ce qui est déjà passé */
  const tx=filtresMois(m).filter(t=>t.date<=ymd());let rentree=0,depense=0;
  for(const t of tx){if(t.type==='rentree')rentree+=t.montant;else depense+=t.montant;}
  return {rentree,depense,solde:rentree-depense};
}
function parCategorie(m=moisCourant(),type='depense'){
  const map={};
  for(const t of filtresMois(m)){
    if(t.type!==type)continue;
    map[t.categorie]=(map[t.categorie]||0)+t.montant;
  }
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function joursDansMois(m=moisCourant()){
  const y=parseInt(m.slice(0,4)),mo=parseInt(m.slice(5,7));
  return new Date(y,mo,0).getDate();
}
function joursRestants(){
  const auj=parseInt(ymd().slice(8,10)),tot=joursDansMois();
  return Math.max(1,tot-auj+1);
}
/* Source unique des revenus du mois : revenus déclarés à l'inscription OU rentrées enregistrées */
function revenuMensuel(m=moisCourant()){
  return (D.profile.revenusMensuels>0)?D.profile.revenusMensuels:totaux(m).rentree;
}
/* ---- Épargne = second compte : dépôts enregistrés ---- */
function depotsDuMois(m=moisCourant()){
  const auj=ymd();
  return (D.epargneDepots||[]).filter(d=>d.date.slice(0,7)===m && d.date<=auj);
}
function epargneDuMois(m=moisCourant()){
  return depotsDuMois(m).reduce((s,d)=>s+d.montant,0);
}
function epargneTotale(){
  return (D.epargneDepots||[]).reduce((s,d)=>s+d.montant,0);
}
/* 1. Il te reste X € par jour — l'argent mis de côté n'est plus dépensable */
function resteParJour(){
  const t=totaux();
  const base=revenuMensuel()-t.depense-epargneDuMois();
  const parJour=base/joursRestants();
  return {base,parJour,jours:joursRestants(),ok:parJour>=0};
}
/* 2. Comparaison avec le mois dernier */
function comparaisonMois(){
  const cur=totaux().depense,prev=totaux(moisPrecedent()).depense;
  const diff=cur-prev;
  return {cur,prev,diff,pct:prev>0?Math.round(diff/prev*100):null};
}
/* 3. Solde prévu en fin de mois */
function soldePrevu(){
  const t=totaux(),auj=parseInt(ymd().slice(8,10));
  const moyenne=auj>0?t.depense/auj:0;
  const reste=moyenne*Math.max(0,joursDansMois()-auj);
  const solde=revenuMensuel()-t.depense-epargneDuMois();
  return {aujourdhui:solde,depenseMoyenne:moyenne,restEstime:reste,fin:solde-reste};
}
/* 4. Épargne : montant réellement versé ce mois (objectif = simple repère) */
function progresEpargne(){
  const obj=D.profile.objectifEpargne||0;
  const epargne=epargneDuMois();
  const revenu=revenuMensuel();
  const irrealiste=obj>revenu;
  if(obj<=0)return {montant:epargne,objectif:0,pct:0,irrealiste:false,
    texte:'Pas d\'objectif défini — '+fmtNum(epargne)+' '+devise()+' versés ce mois'};
  const pct=Math.min(100,Math.round((epargne/obj)*100));
  if(irrealiste){
    return {montant:epargne,objectif:obj,pct,irrealiste:true,
      texte:'Objectif trop élevé : tu gagnes '+fmtNum(revenu)+' '+devise()+' par mois. Baisse-le à '+fmtNum(Math.max(0,Math.floor(revenu*0.3)))+' '+devise()+' maximum.'};
  }
  return {montant:epargne,objectif:obj,pct,irrealiste:false,
    texte:epargne===0?'Aucun versement ce mois':epargne>=obj?'Objectif atteint !':'Il reste '+(obj-epargne)+' '+devise()+' à verser ce mois'};
}
function devise(){return esc(String(D.profile.devise||'€').slice(0,5))}

/* Applique le thème et la couleur d'accent choisie */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',D.settings.theme);
  /* Papier & Encre : on ne touche pas aux tokens tant que l'utilisateur n'a pas choisi sa propre couleur */
  if(!D.settings.acCustom){
    ['--ac','--ac-text','--ac-tx'].forEach(p=>document.documentElement.style.removeProperty(p));
    return;
  }
  const hex=D.settings.ac;
  if(/^#[0-9a-f]{6}$/i.test(hex)){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    const L=(0.2126*r+0.7152*g+0.0722*b)/255;
    const f=D.settings.theme==='light'?0.68:1;
    const shade=c=>Math.round(c*f);
    document.documentElement.style.setProperty('--ac','rgb('+r+','+g+','+b+')');
    document.documentElement.style.setProperty('--ac-text','rgb('+shade(r)+','+shade(g)+','+shade(b)+')');
    document.documentElement.style.setProperty('--ac-tx',L>0.58?'#0a0a0c':'#ffffff');
  }
}

    </div>`).join(''):'<div class="empty"><i>♻️</i><div>Aucune opération automatique</div></div>'}
    <button class="btn block" id="rec-add" style="margin-top:10px">➕ Ajouter une opération automatique</button>
  </div>`;
}
function bindObjectif(){
  $('#obj-save')?.addEventListener('click',()=>{
    D.profile.objectifEpargne=num($('#obj-input').value);save();render();toast('Objectif mis à jour');
  });
  $('#depot-add')?.addEventListener('click',openAjouterDepot);
  $$('[data-del-depot]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer ce versement ? Le total épargné baissera.'))return;
    D.epargneDepots=D.epargneDepots.filter(x=>x.id!==b.dataset.delDepot);
    save();render();toast('Versement supprimé');
  }));
  $('#rec-add')?.addEventListener('click',openAjouterRecurrent);
  $$('[data-rec-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const r=D.recurrents.find(x=>x.id===b.dataset.recToggle);if(!r)return;
    r.actif=!r.actif;save();render();
  }));
  $$('[data-rec-del]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer cette opération automatique ?'))return;
    D.recurrents=D.recurrents.filter(x=>x.id!==b.dataset.recDel);save();render();
  }));
}

function categoriser(desc){

/* Virements internes / épargne : ne sont PAS des dépenses « style de vie » */
const REGLE_VIREMENT=/virement|transfer|compte boost|à partir de|à .* compte|to moi bourso|to darius|to samir|to zara|rechargez|changes/i;
/* Analyse des dépenses : agrège transactions + import Revolut */
function donneesAnalyse(){
  let tx=[];
  /* Transactions de l'appli */
  for(const t of D.transactions){
    if(t.type!=='depense')continue;
    if(!dansPeriode(t.date))continue;
    tx.push({date:t.date,desc:t.note||t.categorie,montant:t.montant,cat:t.categorie});
  }
  /* Transactions importées */
  for(const t of (D.importReleve||[])){
    if(t.montant>=0)continue;
    if(!dansPeriode(t.date))continue;
    /* Les virements sont inclus et classés dans « Virement » */
    const estVirement=REGLE_VIREMENT.test(t.desc||'')||REGLE_VIREMENT.test(t.cat||'');
    tx.push({date:t.date,desc:t.desc,montant:Math.abs(t.montant),cat:estVirement?'Virement':(t.cat||categoriser(t.desc))});
  }
  const map={};
  let total=0;
  for(const t of tx){map[t.cat]=(map[t.cat]||0)+t.montant;total+=t.montant;}
  const cats=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([nom,montant])=>({
    nom,montant,pct:total>0?Math.round(montant/total*100):0,couleur:CAT_COULEURS[nom]||'#8B877E'
  }));
  return {cats,total,nb:tx.length};
}
function donutSVG(cats,total){
  const R=70,C=2*Math.PI*R;let offset=0;let arcs='';
  for(const c of cats){
    const len=(c.pct/100)*C;
    arcs+=`<circle cx="100" cy="100" r="${R}" stroke="${c.couleur}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" />`;
    offset+=len;
  }
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Répartition des dépenses">
    <circle class="bg" cx="100" cy="100" r="${R}"></circle>${arcs}
    <text x="100" y="98" text-anchor="middle" class="donut-center">${fmtNum(total)}</text>
    <text x="100" y="118" text-anchor="middle" class="donut-sub">${devise()} dépensés</text>
  </svg>`;
}

}

function marchandsFiltres(){
  const map={};
  if(D.analyseDemo&&typeof MARCHANDS_MOIS!=='undefined'){
    for(const m of moisAnalyse()){
      if(!dansPeriode(m+'-01'))continue;
      const liste=MARCHANDS_MOIS[m];if(!liste)continue;
      for(const x of liste){
        if(!map[x.nom])map[x.nom]={nom:x.nom,montant:0,nb:0};
        map[x.nom].montant+=x.montant;map[x.nom].nb+=x.nb;
      }
    }
  }
  /* Transactions saisies dans l'appli */
  for(const t of D.transactions){
    if(t.type!=='depense'||!dansPeriode(t.date))continue;
    const nom=String(t.note||t.categorie||'').slice(0,50);
    if(!nom)continue;
    if(!map[nom])map[nom]={nom,montant:0,nb:0};
    map[nom].montant+=t.montant;map[nom].nb++;
  }
  /* Marchands des fichiers importés */
  for(const t of (D.importReleve||[])){
    if(t.montant>=0||!dansPeriode(t.date))continue;
    const estVirement=REGLE_VIREMENT.test(t.desc||'')||REGLE_VIREMENT.test(t.cat||'');
    const nom=estVirement?('Virement : '+String(t.desc||'').slice(0,40)):String(t.desc||'').slice(0,50);
    if(!nom)continue;
    if(!map[nom])map[nom]={nom,montant:0,nb:0};
    map[nom].montant+=Math.abs(t.montant);map[nom].nb++;
  }
  return Object.values(map).sort((a,b)=>b.montant-a.montant).map(x=>({nom:x.nom,montant:Math.round(x.montant*100)/100,nb:x.nb}));
}

/* ---- Import de relevé ---- */
function parseCSV(texte){
  const lignes=texte.split(/\r?\n/).filter(l=>l.trim());
  if(!lignes.length)return [];
  const sep=lignes[0].includes(';')?';':',';
  const entetes=lignes[0].split(sep).map(s=>s.trim().toLowerCase().replace(/"/g,''));
  const idx=(...mots)=>entetes.findIndex(e=>mots.some(m=>e.includes(m)));
  const iDate=idx('date');
  const iDesc=idx('description','libell','merchant','commer');
  const iMontant=idx('amount','montant','argent');
  const iCat=idx('categor','category');
  const out=[];
  for(let i=1;i<lignes.length;i++){
    const cols=lignes[i].split(sep).map(s=>s.replace(/^"|"$/g,'').trim());
    const date=cols[iDate]||'';
    const desc=cols[iDesc]||lignes[i];
    /* formats : 2025-04-02, 02/04/2025 */
    let dm=ymd();
    if(/^\d{4}-\d{2}-\d{2}/.test(date))dm=date.slice(0,10);
    else if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(date)){const p=date.split('/');dm=p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')}
    out.push({date:dm,desc,montant:num(cols[iMontant]),cat:cols[iCat]||categoriser(desc)});
  }
  return out.filter(t=>t.desc||t.montant);
}
function parseJSON(texte){
  try{
    const o=JSON.parse(texte);
    const arr=Array.isArray(o)?o:(o.transactions||o.data||[]);
    return arr.map(t=>({
      date:String(t.date||ymd()).slice(0,10),
      desc:String(t.desc||t.description||t.note||''),
      montant:num(t.montant??t.amount),
      cat:String(t.cat||t.categorie||'')||categoriser(t.desc||t.description)
    }));
  }catch{return []}
}
async function importerFichier(fichier){
  if(!fichier)return;
  const nom=fichier.name.toLowerCase();
  try{
    let transactions=[];
    if(nom.endsWith('.json')){transactions=parseJSON(await fichier.text());}
    else if(nom.endsWith('.pdf')){
      /* PDF : extraction simple du texte lisible (mots-clés + montants) */
      const buf=await fichier.arrayBuffer();
      const txt=new TextDecoder('latin1').decode(buf);
      const lignes=txt.split(/\r?\n/);
      const mois={'janv':1,'févr':2,'mars':3,'avr':4,'mai':5,'juin':6,'juil':7,'août':8,'sept':9,'oct':10,'nov':11,'déc':12};
      for(const l of lignes){
        const dm=l.match(/(\d{1,2})\s+(janv|févr|mars|avr|mai|juin|juil|août|sept|oct|nov|déc)[^\s]*\s+(\d{4})/i);
        const mont=l.match(/-?\d+[\s ,]\d{2}(?:,\d{2})?€/);
        if(dm&&mont){
          const date=dm[3]+'-'+String(mois[dm[2].toLowerCase().slice(0,4)]||1).padStart(2,'0')+'-'+dm[1].padStart(2,'0');
          const m=num(mont[0].replace('€','').replace(/\s/g,''));
          transactions.push({date,desc:l.replace(/^\s*\d{1,2}\s+\w+\s+\d{4}\s*/,'').slice(0,80),montant:m,cat:categoriser(l)});
        }
      }
    }
    else{transactions=parseCSV(await fichier.text());}
    if(!transactions.length){toast('Aucune transaction lue dans ce fichier — essaie un export CSV');return;}
    D.importReleve=transactions;save();render();
    toast(transactions.length+' opérations importées et analysées');
  }catch(e){toast('Impossible de lire ce fichier');}
}

  $('#demo-load')?.addEventListener('click',()=>{D.analyseDemo=true;save();render();toast('Relevé Revolut chargé')});
  $('#demo-clear')?.addEventListener('click',()=>{D.analyseDemo=false;save();render()});
  $$('[data-periode]').forEach(b=>b.addEventListener('click',()=>{ANALYSE_PERIODE=b.dataset.periode;render()}));
  $('#analyse-mois')?.addEventListener('change',e=>{ANALYSE_MOIS=e.target.value;render()});
  $('#drop-zone')?.addEventListener('click',()=>$('#file-releve')?.click());
  $('#drop-zone')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file-releve')?.click()}});
  $('#file-releve')?.addEventListener('change',e=>importerFichier(e.target.files?.[0]));
  const dz=$('#drop-zone');
  dz?.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
  dz?.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz?.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');importerFichier(e.dataTransfer?.files?.[0])});
  $('#import-del')?.addEventListener('click',()=>{
    if(!confirm('Supprimer les opérations importées ?'))return;
    D.importReleve=[];save();render();toast('Import supprimé');
  });
}

/* ============ ONBOARDING ============ */
let ONB={step:0,prenom:'',revenus:0,epargne:0,devise:'€'};
function renderOnboarding(){
  const app=$('#app');
  const steps=5; /* 0 accueil, 1 prénom, 2 revenus, 3 épargne, 4 devise */
  let h='';
  const dots=`<div class="dots">${Array.from({length:steps},(_,i)=>`<i class="${i===ONB.step?'on':''}"></i>`).join('')}</div>`;
  if(ONB.step===0){
    h=`<div class="onb">
      <div class="big-emoji">💰</div>
      <h1>Bienvenue dans<br>NOX</h1>
      <p class="lead">Un carnet simple pour savoir où va ton argent, combien tu peux dépenser chaque jour, et mettre de côté sans stress.</p>
      <button class="btn pri block" id="onb-start" style="min-height:54px;font-size:16px">Commencer</button>
      <p class="tiny muted center" style="margin-top:14px">2 minutes · tout reste sur ton appareil</p>
    </div>`;
  } else if(ONB.step===1){
    h=`<div class="onb">
      <div class="step">Étape 1 sur 4 · Te connaître</div>
      <h1>Comment tu t'appelles ?</h1>
      <p class="lead">Je vais t'appeler comme ça dans l'appli.</p>
      <label class="f">Ton prénom</label>
      <input class="f" id="onb-prenom" placeholder="Ex. Samir" value="${esc(ONB.prenom)}" autocomplete="given-name">
      <button class="btn pri block" id="onb-next" style="margin-top:22px;min-height:54px">Continuer</button>
      ${dots}
    </div>`;
  } else if(ONB.step===2){
    h=`<div class="onb">
      <div class="step">Étape 2 sur 4 · Tes revenus</div>
      <h1>Combien tu gagnes<br>par mois ?</h1>
      <p class="lead">Bourse, salaire, aide de la famille… une estimation suffit.</p>
      <label class="f">Montant mensuel (${ONB.devise})</label>
      <input class="f" id="onb-revenus" type="number" step="0.01" min="0" value="${ONB.revenus||''}" placeholder="Ex. 600" inputmode="decimal">
      <p class="tiny muted" style="margin-top:8px">Tu pourras toujours le changer plus tard.</p>
      <button class="btn pri block" id="onb-next" style="margin-top:18px;min-height:54px">Continuer</button>
      ${dots}
    </div>`;
  } else if(ONB.step===3){
    h=`<div class="onb">
      <div class="step">Étape 3 sur 4 · Ton objectif</div>
      <h1>Combien tu veux<br>mettre de côté ?</h1>
      <p class="lead">Chaque mois, une petite somme mise de côté fait une grosse différence.</p>
      <label class="f">Épargne mensuelle (${ONB.devise})</label>
      <input class="f" id="onb-epargne" type="number" step="0.01" min="0" value="${ONB.epargne||''}" placeholder="Ex. 50" inputmode="decimal">
      <div class="row" style="margin-top:10px">${[0,25,50,100].map(v=>`<button class="pill" data-ep="${v}">${v} ${ONB.devise}</button>`).join('')}</div>
      <button class="btn pri block" id="onb-next" style="margin-top:18px;min-height:54px">Continuer</button>
      ${dots}
    </div>`;
  } else {
    h=`<div class="onb">
      <div class="step">Étape 4 sur 4 · Dernière question</div>
      <h1>Ta devise ?</h1>
      <p class="lead">On utilisera ce symbole partout dans l'appli.</p>
      ${['€','$','£','¥'].map(v=>`<button type="button" class="card-opt ${ONB.devise===v?'on':''}" data-dev="${v}" aria-pressed="${ONB.devise===v}"><span class="e">${v}</span><span>${v==='€'?'Euro':v==='$'?'Dollar':v==='£'?'Livre':'Yen'}</span></button>`).join('')}
      <button class="btn pri block" id="onb-finish" style="margin-top:20px;min-height:54px">Terminer</button>
      ${dots}
    </div>`;
  }
  app.innerHTML=h;
  /* Events */
  $('#onb-start')?.addEventListener('click',()=>{ONB.step=1;renderOnboarding()});
  $('#onb-next')?.addEventListener('click',()=>{
    if(ONB.step===1){
      ONB.prenom=$('#onb-prenom').value.trim().slice(0,40);
      if(!ONB.prenom){toast('Dis-moi ton prénom');return;}
    }
    if(ONB.step===2)ONB.revenus=num($('#onb-revenus').value);
    if(ONB.step===3)ONB.epargne=num($('#onb-epargne').value);
    ONB.step++;renderOnboarding();
  });
  $$('[data-ep]').forEach(b=>b.addEventListener('click',()=>{ONB.epargne=num(b.dataset.ep);$('#onb-epargne').value=String(b.dataset.ep)}));
  $$('[data-dev]').forEach(b=>b.addEventListener('click',()=>{ONB.devise=b.dataset.dev;renderOnboarding()}));
  $('#onb-finish')?.addEventListener('click',()=>{
    D.profile.prenom=ONB.prenom;
    D.profile.revenusMensuels=ONB.revenus;
    D.profile.objectifEpargne=ONB.epargne;
    D.profile.devise=ONB.devise;
    D.onboarded=true;save();VIEW='accueil';render();toast('Tout est prêt !');
  });
}

/* ============ AJOUTER UNE OPÉRATION ============ */
/* ============ VUE AJOUTER — page pleine écran ============ */
let AJ_TYPE='depense',AJ_CAT=CAT_DEPENSE[0],AJ_RECURR=false;
function vueAjouter(){
  return `<div class="wrap">
    <div class="page-head">
      <button class="back" id="aj-back" aria-label="Retour à l'accueil">←</button>
      <h2>Nouvelle opération</h2>
    </div>
    <div class="seg ac" style="margin-bottom:24px">
      <button class="seg button ${AJ_TYPE==='depense'?'on':''}" id="t-depense">Dépense</button>
      <button class="seg button ${AJ_TYPE==='rentree'?'on':''}" id="t-rentree">Rentrée</button>
    </div>
    <label class="f">Montant (${devise()})</label>
    <input class="f" id="in-montant" type="number" step="0.01" min="0" placeholder="0,00" inputmode="decimal">
    <label class="f">Catégorie</label><div class="cat-chips" id="cats-chips"></div>
    <label class="f">Date</label><input class="f" id="in-date" type="date" value="${ymd()}">
    <label class="f">Note</label><input class="f" id="in-note" placeholder="Ex. Courses, loyer, salaire…">
    <div class="row" style="margin-top:22px"><button class="chk ${AJ_RECURR?'on':''}" id="in-recurr" role="checkbox" aria-checked="${AJ_RECURR}" aria-label="Répéter chaque mois">${AJ_RECURR?'✓':''}</button><span>Répéter chaque mois automatiquement</span></div>
    <button class="btn pri block" id="in-save" style="margin-top:28px">Enregistrer</button>
  </div>`;
}
function refreshAjCats(){
  const cList=AJ_TYPE==='depense'?CAT_DEPENSE:CAT_RENTEE;
  if(!cList.includes(AJ_CAT))AJ_CAT=cList[0];
  const el=$('#cats-chips');if(!el)return;
  el.innerHTML=cList.map(c=>`<button class="pill ${c===AJ_CAT?'on':''}">${esc(c)}</button>`).join('');
  $$('#cats-chips button').forEach((b,i)=>b.addEventListener('click',()=>{AJ_CAT=cList[i];refreshAjCats()}));
}
function bindAjouter(){
  refreshAjCats();
  $('#aj-back')?.addEventListener('click',()=>{VIEW='accueil';render()});
  $('#t-depense')?.addEventListener('click',()=>{AJ_TYPE='depense';refreshAjCats();render()});
  $('#t-rentree')?.addEventListener('click',()=>{AJ_TYPE='rentree';refreshAjCats();render()});
  $('#in-recurr')?.addEventListener('click',e=>{
    AJ_RECURR=!AJ_RECURR;e.currentTarget.classList.toggle('on',AJ_RECURR);
    e.currentTarget.setAttribute('aria-checked',String(AJ_RECURR));e.currentTarget.textContent=AJ_RECURR?'✓':'';
  });
  $('#in-save')?.addEventListener('click',()=>{
    const m=num($('#in-montant').value);
    if(m<=0){toast('Montant invalide');return;}
    const d=$('#in-date').value||ymd();
    const n=$('#in-note').value.trim()||AJ_CAT;
    const tx={id:uid(),type:AJ_TYPE,categorie:AJ_CAT,montant:m,date:d,note:n,recursif:AJ_RECURR,recurrenceld:AJ_RECURR?uid():''};
    D.transactions.push(tx);
    if(AJ_RECURR)D.recurrents.push({id:tx.recurrenceld,nom:n,type:AJ_TYPE,categorie:AJ_CAT,montant:m,jour:parseInt(d.slice(8,10)),actif:true});
    AJ_RECURR=false;save();genereRecurrentsMois();VIEW='accueil';render();toast('Opération enregistrée');
  });
}

  const sheet=$('#sheet');openSheet();
  sheet.innerHTML=`<div class="grab"></div>
  <div class="sh-head"><h2 id="sheet-title">Mettre de côté</h2><button class="btn ghost" id="btn-close">Annuler</button></div>
  <p class="small muted">Cet argent est mis à part : il ne sera plus compté dans ton budget dépensable.</p>
  <label class="f">Montant (${devise()})</label>
  <input class="f" id="dep-montant" type="number" step="0.01" min="0" placeholder="Ex. 50" inputmode="decimal">
  <label class="f">Date du versement</label>
  <input class="f" id="dep-date" type="date" value="${ymd()}" max="${ymd()}">
  <label class="f">Note (optionnel)</label>
  <input class="f" id="dep-note" placeholder="Ex. Épargne du mois">
  <button class="btn pri block" id="dep-save" style="margin-top:22px">Enregistrer le versement</button>`;
  $('#dep-save')?.addEventListener('click',()=>{
    const m=num(sheet.querySelector('#dep-montant').value);
    if(m<=0){toast('Montant invalide');return;}
    const d=sheet.querySelector('#dep-date').value||ymd();
    const n=sheet.querySelector('#dep-note').value.trim()||'Versement épargne';
    D.epargneDepots.push({id:uid(),montant:m,date:d,note:n});
    save();closeSheet();render();toast('Versement enregistré');
  });
  $('#btn-close')?.addEventListener('click',closeSheet);
}

function openAjouterRecurrent(){
  const sheet=$('#sheet');openSheet();
  let type='depense',cat=CAT_DEPENSE[0];
  sheet.innerHTML=`<div class="grab"></div>
  <div class="sh-head"><h2 id="sheet-title">Opération automatique</h2><button class="btn ghost" id="btn-close">Annuler</button></div>
  <div class="seg ac" style="margin-bottom:12px"><button class="seg button on" id="rt-depense">Dépense</button><button class="seg button" id="rt-rentree">Rentrée</button></div>
  <label class="f">Nom (ex. Loyer, Salaire)</label><input class="f" id="rn-nom" placeholder="Loyer">
  <label class="f">Montant (${devise()})</label><input class="f" id="rn-montant" type="number" step="0.01" min="0" inputmode="decimal">
  <label class="f">Catégorie</label><div class="cat-chips" id="rn-cats"></div>
  <label class="f">Jour du mois</label><input class="f" id="rn-jour" type="number" min="1" max="28" value="1">
  <button class="btn pri block" id="rn-save" style="margin-top:18px">Enregistrer</button>`;
  function rCats(){const cList=type==='depense'?CAT_DEPENSE:CAT_RENTEE;if(!cList.includes(cat))cat=cList[0];sheet.querySelector('#rn-cats').innerHTML=cList.map(c=>`<button class="pill ${c===cat?'on':''}">${esc(c)}</button>`).join('');sheet.querySelectorAll('#rn-cats button').forEach((b,i)=>b.addEventListener('click',()=>{cat=cList[i];rCats()}))}
  rCats();
  sheet.querySelector('#rt-depense').addEventListener('click',()=>{type='depense';sheet.querySelector('#rt-depense').classList.add('on');sheet.querySelector('#rt-rentree').classList.remove('on');rCats()});
  sheet.querySelector('#rt-rentree').addEventListener('click',()=>{type='rentree';sheet.querySelector('#rt-rentree').classList.add('on');sheet.querySelector('#rt-depense').classList.remove('on');rCats()});
  sheet.querySelector('#rn-save').addEventListener('click',()=>{
    const nom=sheet.querySelector('#rn-nom').value.trim(),m=num(sheet.querySelector('#rn-montant').value),j=clamp(num(sheet.querySelector('#rn-jour').value)||1,1,28);
    if(!nom||m<=0){toast('Nom et montant requis');return;}
    D.recurrents.push({id:uid(),nom,type,categorie:cat,montant:m,jour:j,actif:true});
    save();closeSheet();genereRecurrentsMois();render();toast('Opération automatique créée');
  });
  $('#btn-close').addEventListener('click',closeSheet);
}
